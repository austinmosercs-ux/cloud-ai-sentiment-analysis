<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Sentiment Analysis</title>
  <style>
    /* ── Reset & Base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8;
      color: #2d3748;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    /* ── Layout ───────────────────────────────────────────────── */
    .container { width: 100%; max-width: 720px; }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }
    header h1 { font-size: 1.8rem; font-weight: 700; color: #1a202c; }
    header p  { color: #718096; margin-top: .4rem; font-size: .95rem; }

    /* ── Cards ────────────────────────────────────────────────── */
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; color: #4a5568; }

    /* ── Form ─────────────────────────────────────────────────── */
    textarea {
      width: 100%;
      min-height: 120px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      padding: .75rem 1rem;
      font-size: .95rem;
      resize: vertical;
      transition: border-color .2s;
      font-family: inherit;
    }
    textarea:focus { outline: none; border-color: #4299e1; }

    .char-count { font-size: .78rem; color: #a0aec0; text-align: right; margin-top: .3rem; }

    button {
      margin-top: 1rem;
      width: 100%;
      padding: .75rem;
      background: #2b6cb0;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s, opacity .2s;
    }
    button:hover:not(:disabled) { background: #3182ce; }
    button:disabled { opacity: .55; cursor: not-allowed; }

    /* ── Result ───────────────────────────────────────────────── */
    #result { display: none; }

    .sentiment-badge {
      display: inline-block;
      padding: .35rem .9rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: .03em;
    }
    .badge-POSITIVE { background: #c6f6d5; color: #276749; }
    .badge-NEGATIVE { background: #fed7d7; color: #9b2c2c; }
    .badge-NEUTRAL  { background: #e2e8f0; color: #4a5568; }
    .badge-MIXED    { background: #fefcbf; color: #744210; }

    /* ── Score bars ───────────────────────────────────────────── */
    .scores { margin-top: 1.2rem; display: flex; flex-direction: column; gap: .6rem; }

    .score-row { display: flex; align-items: center; gap: .75rem; }
    .score-label { width: 72px; font-size: .82rem; font-weight: 600; color: #4a5568; text-transform: capitalize; }
    .bar-bg {
      flex: 1;
      height: 10px;
      background: #edf2f7;
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width .5s ease;
    }
    .bar-POSITIVE { background: #48bb78; }
    .bar-NEGATIVE { background: #fc8181; }
    .bar-NEUTRAL  { background: #90cdf4; }
    .bar-MIXED    { background: #f6ad55; }
    .score-pct { width: 44px; text-align: right; font-size: .82rem; color: #718096; }

    /* ── History table ────────────────────────────────────────── */
    #history { display: none; }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: .75rem;
    }
    .history-header h2 { margin: 0; }

    #refreshBtn {
      width: auto;
      margin: 0;
      padding: .4rem .9rem;
      font-size: .82rem;
      background: #edf2f7;
      color: #4a5568;
      border-radius: 6px;
    }
    #refreshBtn:hover { background: #e2e8f0; }

    table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    thead tr { border-bottom: 2px solid #edf2f7; }
    th { padding: .5rem .6rem; text-align: left; color: #718096; font-weight: 600; }
    td { padding: .55rem .6rem; border-bottom: 1px solid #f7fafc; }
    tr:last-child td { border-bottom: none; }
    .review-cell { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ── Spinner ──────────────────────────────────────────────── */
    .spinner {
      width: 20px; height: 20px;
      border: 3px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-right: .5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error ────────────────────────────────────────────────── */
    .error-msg { color: #e53e3e; font-size: .9rem; margin-top: .75rem; }

    /* ── URL input ─────────────────────────────────────────────── */
    .url-input {
      width: 100%;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      padding: .75rem 1rem;
      font-size: .95rem;
      font-family: inherit;
      transition: border-color .2s;
    }
    .url-input:focus { outline: none; border-color: #4299e1; }

    .hint {
      font-size: .78rem;
      color: #a0aec0;
      margin-top: .4rem;
    }
    .hint code {
      background: #edf2f7;
      padding: .1rem .35rem;
      border-radius: 4px;
      font-size: .75rem;
    }

    /* ── Verdict row ───────────────────────────────────────────── */
    .verdict-row {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin-bottom: .5rem;
      flex-wrap: wrap;
    }
    .review-count {
      font-size: .82rem;
      color: #718096;
    }

    /* ── Sample reviews ────────────────────────────────────────── */
    .samples {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 1.5rem;
    }
    @media (max-width: 600px) {
      .samples { grid-template-columns: 1fr; }
    }
    .sample-col h3 {
      font-size: .85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: .5rem;
    }
    .positive-heading { color: #276749; }
    .negative-heading { color: #9b2c2c; }
    .sample-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: .5rem;
    }
    .sample-list li {
      background: #f7fafc;
      border-left: 3px solid #cbd5e0;
      padding: .55rem .7rem;
      border-radius: 4px;
      font-size: .82rem;
      line-height: 1.4;
      color: #4a5568;
    }
    .sample-list li.positive-item { border-left-color: #48bb78; }
    .sample-list li.negative-item { border-left-color: #fc8181; }
    .sample-list .sample-score {
      display: block;
      font-size: .72rem;
      color: #a0aec0;
      margin-top: .25rem;
    }
  </style>
</head>
<body>

<div class="container">

  <header>
    <h1>AI Sentiment Analysis</h1>
    <p>Powered by Amazon Comprehend &amp; AWS Lambda</p>
  </header>

  <!-- ── Analyze Card ──────────────────────────────────────────── -->
  <div class="card">
    <h2>Analyze a Product</h2>
    <input id="productUrl" type="url"
      placeholder="Paste an Amazon or Walmart product link…"
      class="url-input" />
    <div class="hint">
      Example: <code>https://www.amazon.com/dp/B08N5WRWNW</code>
    </div>
    <div id="errorMsg" class="error-msg"></div>
    <button id="analyzeBtn">Analyze Reviews</button>
  </div>

  <!-- ── Result Card ───────────────────────────────────────────── -->
  <div class="card" id="result">
    <h2 id="productTitle">Result</h2>
    <div class="verdict-row">
      <strong>Overall Verdict: </strong>
      <span class="sentiment-badge" id="sentimentBadge"></span>
      <span class="review-count" id="reviewCountLabel"></span>
    </div>
    <div class="scores" id="scoresContainer"></div>

    <div class="samples">
      <div class="sample-col">
        <h3 class="sample-heading positive-heading">Top Positive Reviews</h3>
        <ul id="topPositiveList" class="sample-list"></ul>
      </div>
      <div class="sample-col">
        <h3 class="sample-heading negative-heading">Top Critical Reviews</h3>
        <ul id="topNegativeList" class="sample-list"></ul>
      </div>
    </div>
  </div>

  <!-- ── History Card ─────────────────────────────────────────── -->
  <div class="card" id="history">
    <div class="history-header">
      <h2>Recently Analyzed Products</h2>
      <button id="refreshBtn">Refresh</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>Product</th>
          <th>Site</th>
          <th>Sentiment</th>
          <th>Reviews</th>
          <th>Time</th>
        </tr>
      </thead>
      <tbody id="historyBody"></tbody>
    </table>
  </div>

</div>

<script type="module">
  // CONFIG
  const API_BASE = "https://wqg809a91a.execute-api.us-east-1.amazonaws.com/";

  // DOM references
  const urlInput         = document.getElementById("productUrl");
  const analyzeBtn       = document.getElementById("analyzeBtn");
  const errorMsg         = document.getElementById("errorMsg");
  const resultCard       = document.getElementById("result");
  const productTitleEl   = document.getElementById("productTitle");
  const badge            = document.getElementById("sentimentBadge");
  const reviewCountLabel = document.getElementById("reviewCountLabel");
  const scoresContainer  = document.getElementById("scoresContainer");
  const topPositiveList  = document.getElementById("topPositiveList");
  const topNegativeList  = document.getElementById("topNegativeList");

  analyzeBtn.addEventListener("click", analyzeProduct);
  document.getElementById("refreshBtn").addEventListener("click", loadHistory);
  urlInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") analyzeProduct();
  });

  // URL validation
  const URL_HINT = /(amazon\.|walmart\.com)/i;

  function isLikelySupportedUrl(value) {
    return URL_HINT.test(value);
  }

  // Analyze
  async function analyzeProduct() {
    const url = urlInput.value.trim();
    errorMsg.textContent = "";

    if (!url) {
      errorMsg.textContent = "Please paste a product URL.";
      return;
    }
    if (!isLikelySupportedUrl(url)) {
      errorMsg.textContent = "Only Amazon and Walmart product links are supported.";
      return;
    }

    analyzeBtn.disabled = true;
    setButtonPhase("Fetching reviews…");

    try {
      const phaseTimer = setTimeout(() => setButtonPhase("Analyzing sentiment…"), 2500);

      const res = await fetch(`${API_BASE}/analyze`, {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({ url }),
      });

      const data = await res.json();
      clearTimeout(phaseTimer);
      if (!res.ok) {
        throw new Error(data.error || `HTTP ${res.status}`);
      }

      renderResult(data);
      loadHistory();
    } catch (err) {
      errorMsg.textContent = `Error: ${err.message}`;
    } finally {
      analyzeBtn.disabled = false;
      analyzeBtn.textContent = "Analyze Reviews";
    }
  }

  function setButtonPhase(label) {
    analyzeBtn.replaceChildren();
    const spinner = document.createElement("span");
    spinner.className = "spinner";
    analyzeBtn.appendChild(spinner);
    analyzeBtn.appendChild(document.createTextNode(label));
  }

  // Render result
  function renderResult(data) {
    productTitleEl.textContent = data.productTitle || "Result";

    if (data.reviewCount === 0) {
      badge.textContent = "—";
      badge.className = "sentiment-badge";
      reviewCountLabel.textContent = data.message || "This product has no reviews yet.";
      scoresContainer.replaceChildren();
      topPositiveList.replaceChildren();
      topNegativeList.replaceChildren();
      resultCard.style.display = "block";
      resultCard.scrollIntoView({ behavior: "smooth", block: "nearest" });
      return;
    }

    badge.textContent = data.overallSentiment;
    badge.className = `sentiment-badge badge-${data.overallSentiment}`;
    reviewCountLabel.textContent = `based on ${data.reviewCount} reviews`;

    renderScoreBars(data.aggregateScores);
    renderSampleList(topPositiveList, data.topPositive, "positive-item");
    renderSampleList(topNegativeList, data.topNegative, "negative-item");

    resultCard.style.display = "block";
    resultCard.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function renderScoreBars(scores) {
    scoresContainer.replaceChildren();
    const order = ["positive", "negative", "neutral", "mixed"];
    for (const key of order) {
      const pct = (scores[key] * 100).toFixed(1);

      const row = document.createElement("div");
      row.className = "score-row";

      const label = document.createElement("span");
      label.className = "score-label";
      label.textContent = key;

      const bg = document.createElement("div");
      bg.className = "bar-bg";
      const fill = document.createElement("div");
      fill.className = `bar-fill bar-${key.toUpperCase()}`;
      fill.style.width = `${pct}%`;
      bg.appendChild(fill);

      const pctEl = document.createElement("span");
      pctEl.className = "score-pct";
      pctEl.textContent = `${pct}%`;

      row.appendChild(label);
      row.appendChild(bg);
      row.appendChild(pctEl);
      scoresContainer.appendChild(row);
    }
  }

  function renderSampleList(listEl, samples, cssClass) {
    listEl.replaceChildren();
    if (!samples || samples.length === 0) {
      const li = document.createElement("li");
      li.textContent = "No samples available.";
      listEl.appendChild(li);
      return;
    }
    for (const s of samples.slice(0, 3)) {
      const li = document.createElement("li");
      li.className = cssClass;

      const truncated = s.text.length > 300 ? s.text.slice(0, 300) + "…" : s.text;
      li.appendChild(document.createTextNode(truncated));

      const scoreSpan = document.createElement("span");
      scoreSpan.className = "sample-score";
      scoreSpan.textContent = `confidence ${(s.score * 100).toFixed(0)}%`;
      li.appendChild(scoreSpan);

      listEl.appendChild(li);
    }
  }

  // History
  async function loadHistory() {
    const historyCard = document.getElementById("history");
    const tbody       = document.getElementById("historyBody");

    try {
      const res  = await fetch(`${API_BASE}/history`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

      tbody.replaceChildren();
      const analyses = data.analyses || [];

      if (analyses.length === 0) {
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = 5;
        td.style.textAlign = "center";
        td.style.color = "#a0aec0";
        td.style.padding = "1rem";
        td.textContent = "No analyses yet.";
        tr.appendChild(td);
        tbody.appendChild(tr);
      } else {
        for (const a of analyses) {
          tbody.appendChild(buildHistoryRow(a));
        }
      }

      historyCard.style.display = "block";
    } catch (err) {
      console.error("History load failed:", err.message);
    }
  }

  function buildHistoryRow(a) {
    const tr = document.createElement("tr");

    const productCell = document.createElement("td");
    productCell.className = "review-cell";
    const link = document.createElement("a");
    link.href = a.productUrl || "#";
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = a.productTitle || "(untitled)";
    productCell.title = a.productTitle || "";
    productCell.appendChild(link);
    tr.appendChild(productCell);

    const siteCell = document.createElement("td");
    siteCell.textContent = (a.site || "").toUpperCase();
    tr.appendChild(siteCell);

    const sentimentCell = document.createElement("td");
    const sentBadge = document.createElement("span");
    sentBadge.className = `sentiment-badge badge-${a.overallSentiment}`;
    sentBadge.style.fontSize = ".75rem";
    sentBadge.style.padding = ".2rem .6rem";
    sentBadge.textContent = a.overallSentiment || "—";
    sentimentCell.appendChild(sentBadge);
    tr.appendChild(sentimentCell);

    const countCell = document.createElement("td");
    countCell.textContent = String(a.reviewCount || 0);
    tr.appendChild(countCell);

    const timeCell = document.createElement("td");
    timeCell.textContent = a.timestamp ? new Date(a.timestamp).toLocaleString() : "";
    tr.appendChild(timeCell);

    return tr;
  }

  await loadHistory();
</script>
</body>
</html>
